name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v3

      - name: Check SSH Secrets
        run: |
          if [ -z "${{ secrets.GCP_VM_HOST }}" ] || [ -z "${{ secrets.GCP_VM_USER }}" ]; then
            echo "⚠️  Skipping deployment: SSH secrets not configured"
            echo "Please add these secrets in Settings → Secrets and variables → Actions:"
            echo "  - GCP_VM_HOST"
            echo "  - GCP_VM_USER"
            echo "  - GCP_SSH_KEY"
            echo "  - GCP_SSH_KNOWN_HOSTS"
            exit 0
          fi

      - name: Deploy to Google Cloud VM
        if: secrets.GCP_VM_HOST != ''
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
        run: |
          # Create temporary SSH key file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add known hosts
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          
          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << 'EOF'
            set -e
            
            echo "📦 Pulling latest code..."
            cd ~/lifepilot || mkdir -p ~/lifepilot && cd ~/lifepilot && git init
            git remote remove origin 2>/dev/null || true
            git remote add origin https://github.com/Faxriddin1/productflow.git
            git pull origin main || git clone https://github.com/Faxriddin1/productflow.git .
            
            echo "🔄 Rebuilding Docker containers..."
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose pull
              docker-compose up -d --build
              
              echo "📝 Running database migrations..."
              sleep 5
              docker-compose exec -T backend python manage.py migrate || true
              
              echo "✅ Deployment completed successfully!"
            else
              echo "❌ Docker Compose not found on server"
              exit 1
            fi
          EOF
          
          # Clean up
          rm -f ~/.ssh/deploy_key

      - name: Notify Deployment
        if: always() && secrets.GCP_VM_HOST != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to lifepilot.uz - ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
