<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LifePilot — Task Management, Focus Timer & Finance Tracker</title>
    <meta name="description" content="LifePilot helps you manage tasks, track habits, stay focused with Pomodoro timer, and control your finances. All-in-one productivity platform." />
    <meta name="keywords" content="task management, productivity, pomodoro timer, focus timer, habit tracker, finance tracker, budget planner, kanban board, lifepilot" />
    <meta name="author" content="LifePilot" />
    <link rel="canonical" href="https://lifepilot.uz/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lifepilot.uz/" />
    <meta property="og:title" content="LifePilot — Your All-in-One Productivity Platform" />
    <meta property="og:description" content="Manage tasks, track habits, stay focused, and control your finances. Free productivity app for professionals." />
    <meta property="og:image" content="https://lifepilot.uz/og-image.png" />
    <meta property="og:site_name" content="LifePilot" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uz_UZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lifepilot.uz/" />
    <meta name="twitter:title" content="LifePilot — Your All-in-One Productivity Platform" />
    <meta name="twitter:description" content="Manage tasks, track habits, stay focused, and control your finances." />
    <meta name="twitter:image" content="https://lifepilot.uz/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vite.svg" />
    <meta name="theme-color" content="#4F46E5" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LifePilot",
      "url": "https://lifepilot.uz",
      "description": "All-in-one productivity platform: task management, focus timer, habit tracking, and personal finance.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "LifePilot"
      }
    }
    </script>
  </head>
  <body class="font-sans antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
